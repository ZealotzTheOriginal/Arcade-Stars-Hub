<div class="auth-layout">
  <div class="auth-card card rainbow-border">
    <app-lang-switch class="auth-lang-switch" />

    <div class="auth-logo">
      <span class="logo-icon"><i class="fa-solid fa-star"></i></span>
      <h1>Arcade Stars Hub</h1>
    </div>
    <h2>{{ 'AUTH.REGISTER.TITLE' | translate }}</h2>

    <form (ngSubmit)="onSubmit()">
      <div class="field">
        <label>{{ 'AUTH.REGISTER.USERNAME' | translate }}</label>
        <input class="input" [(ngModel)]="displayName" name="name" [placeholder]="'AUTH.REGISTER.USERNAME_PLACEHOLDER' | translate" required />
      </div>
      <div class="field">
        <label>{{ 'AUTH.LOGIN.EMAIL' | translate }}</label>
        <input class="input" type="email" [(ngModel)]="email" name="email" placeholder="tu@email.com" required />
      </div>
      <div class="field">
        <label>{{ 'AUTH.LOGIN.PASSWORD' | translate }}</label>
        <input class="input" type="password" [(ngModel)]="password" name="password" [placeholder]="'AUTH.REGISTER.PASSWORD_PLACEHOLDER' | translate" required />
      </div>

      @if (error()) {
        <p class="error-msg">{{ error() }}</p>
      }

      <button class="btn btn--primary full-width" type="submit" [disabled]="loading()">
        {{ (loading() ? 'AUTH.REGISTER.SUBMITTING' : 'AUTH.REGISTER.SUBMIT') | translate }}
      </button>
    </form>

    <div class="auth-links">
      <span>{{ 'AUTH.REGISTER.HAS_ACCOUNT' | translate }}</span>
      <a routerLink="/login">{{ 'AUTH.LOGIN.TITLE' | translate }}</a>
    </div>
  </div>
</div>
